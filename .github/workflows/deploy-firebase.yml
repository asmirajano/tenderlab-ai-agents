name: Test and deploy public Firebase products

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Hosting release scope
        type: choice
        default: all
        options:
          - all
          - tenderapps
          - validate
  push:
    branches:
      - main

permissions:
  contents: read
  actions: read

concurrency:
  group: firebase-production
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Build and test
        # Product boundaries must typecheck independently before the full release suite.
        # Keep this gate separate so a successful bundler cannot hide type failures.
        run: |
          npm --prefix apps/tender-logistics run typecheck
          npm --prefix apps/tender-balance run typecheck
          npm --prefix apps/tender-match run typecheck
          pnpm run test
          npm --prefix apps/tender-access-client run build
          node scripts/build-tender-access-private.mjs
          node scripts/prepare-tender-access-function.mjs
          npm --prefix build/tender-access-release ci --ignore-scripts --workspaces=false
        env:
          NEXT_PUBLIC_TENDER_APPS_URL: https://tenderapps-ai.web.app

      - name: Deploy TenderLab Command Center
        if: (github.event_name == 'push' && !contains(github.event.head_commit.message, '[tenderapps-only]')) || (github.event_name == 'workflow_dispatch' && inputs.scope == 'all')
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TENDERLAB_AI_AGENTS }}
          channelId: live
          projectId: tenderlab-ai-agents
          target: tenderlab

      - name: Deploy Tender Ecosystem Atlas
        if: (github.event_name == 'push' && !contains(github.event.head_commit.message, '[tenderapps-only]')) || (github.event_name == 'workflow_dispatch' && inputs.scope == 'all')
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TENDERLAB_AI_AGENTS }}
          channelId: live
          projectId: tenderlab-ai-agents
          target: ecosystem-atlas

      - name: Deploy independently built Tender Apps
        # The legacy public uploader must not reopen app bytes during access cutover.
        # Re-enable only through the protected gateway-first release workflow.
        if: ${{ false }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TENDERLAB_AI_AGENTS }}
          channelId: live
          projectId: tenderlab-ai-agents
          target: tender-apps

      - name: Require canonical source and previous exact-SHA validation
        if: github.event_name == 'workflow_dispatch' && inputs.scope == 'tenderapps'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          gh run list --workflow deploy-firebase.yml --commit "$GITHUB_SHA" --event push --status success --json databaseId --jq 'length' | grep -Eq '^[1-9][0-9]*$'

      - name: Authenticate protected release using existing deploy identity
        if: github.event_name == 'workflow_dispatch' && inputs.scope == 'tenderapps'
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TENDERLAB_AI_AGENTS }}
          project_id: tenderlab-ai-agents

      - name: Set up protected release tools
        if: github.event_name == 'workflow_dispatch' && inputs.scope == 'tenderapps'
        uses: google-github-actions/setup-gcloud@v3

      - name: Release protected gateway before payload-free Hosting
        if: github.event_name == 'workflow_dispatch' && inputs.scope == 'tenderapps'
        timeout-minutes: 20
        run: |
          npm install --global firebase-tools@15.27.0
          node scripts/release-tender-access.mjs

      - name: Redirect legacy TenderBalance URL
        if: (github.event_name == 'push' && !contains(github.event.head_commit.message, '[tenderapps-only]')) || (github.event_name == 'workflow_dispatch' && inputs.scope == 'all')
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TENDERLAB_AI_AGENTS }}
          channelId: live
          projectId: tenderlab-ai-agents
          target: tender-balance

      - name: Redirect legacy landed-cost hosting target
        if: (github.event_name == 'push' && !contains(github.event.head_commit.message, '[tenderapps-only]')) || (github.event_name == 'workflow_dispatch' && inputs.scope == 'all')
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TENDERLAB_AI_AGENTS }}
          channelId: live
          projectId: tenderlab-ai-agents
          target: tender-apps-legacy
