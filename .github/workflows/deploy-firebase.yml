name: Test and deploy public Firebase products

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: firebase-production
  cancel-in-progress: true

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Build and test
        run: pnpm run test
        env:
          NEXT_PUBLIC_TENDER_BALANCE_URL: https://tenderbalance-ai.web.app
          NEXT_PUBLIC_TENDER_APPS_URL: https://tenderapps-landed-cost.web.app

      - name: Deploy Tender Ecosystem Atlas
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TENDERLAB_AI_AGENTS }}
          channelId: live
          projectId: tenderlab-ai-agents
          target: ecosystem-atlas

      - name: Deploy TenderBalance
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TENDERLAB_AI_AGENTS }}
          channelId: live
          projectId: tenderlab-ai-agents
          target: tender-balance

      - name: Deploy Cost and Landed Price
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TENDERLAB_AI_AGENTS }}
          channelId: live
          projectId: tenderlab-ai-agents
          target: tender-apps
